[project]
name = "parlio-latency-harness"
version = "0.1.0"
description = "Simulated-call latency harness: drives the Parlio agent pipeline and asserts turn budgets"
requires-python = ">=3.12"
dependencies = ["parlio-voice", "livekit-agents~=1.8", "rich>=13.9"]

[project.scripts]
parlio-latency = "latency_harness.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["latency_harness"]
