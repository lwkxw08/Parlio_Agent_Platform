[project]
name = "parlio-e2e"
version = "0.1.0"
description = "Deployed-environment E2E runner: drives synthetic calls, chat and analytics against a live Parlio stack"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28"]

[project.scripts]
parlio-e2e = "e2e.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]
