[project]
name = "parlio-voice"
version = "0.1.0"
description = "Parlio voice worker - LiveKit Agents pipeline (SIP -> STT -> LLM -> TTS)"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[anthropic,cartesia,deepgram,elevenlabs,openai,silero,turn-detector]~=1.8",
    "livekit-api>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "httpx>=0.28",
    "python-dotenv>=1.0",
]

[project.scripts]
parlio-voice = "parlio_voice.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parlio_voice"]
