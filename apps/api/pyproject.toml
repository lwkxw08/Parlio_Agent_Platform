[project]
name = "parlio-api"
version = "0.1.0"
description = "Parlio Core API (FastAPI) - tenant config, call events, dashboard backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "parlio-voice",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "httpx>=0.28",
    "cryptography>=43",
    "livekit-api>=1.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "prometheus-client>=0.21",
    "pypdf>=6.7,<6.19",
]

[project.scripts]
parlio-api = "parlio_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parlio_api"]
