name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parlio
          POSTGRES_PASSWORD: parlio
          POSTGRES_DB: parlio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parlio" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PARLIO_TEST_DATABASE_URL: postgresql+asyncpg://parlio:parlio@localhost:5432/parlio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/voice-worker/parlio_voice apps/api/parlio_api tools/latency-harness/latency_harness
      - run: uv run pytest -q
      - name: Offline latency harness (simulated call)
        run: uv run parlio-latency --turns 5
      - name: Control-plane load test (reduced profile, Postgres store; functional smoke, relaxed SLO on shared runner)
        env:
          PARLIO_STORE_BACKEND: postgres
          PARLIO_DATABASE_URL: postgresql+asyncpg://parlio:parlio@localhost:5432/parlio
        run: |
          uv run uvicorn parlio_api.main:app --port 8765 --log-level warning &
          api=$!
          for i in $(seq 1 30); do curl -fs localhost:8765/healthz && break; sleep 1; done
          uv run parlio-load --base-url http://localhost:8765 --concurrency 20 --calls 100 --tenants 5 --hold 0.5 --settle 5 --slo-p95-ms 1500
          kill "$api"

  security:
    name: Security (dependency audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (locked runtime dependencies)
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace -o /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: npm audit (production dependencies)
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run pages:build

  # Marketing site (apps/marketing): static export, deployed to the Cloudflare Pages
  # project "parliotec-marketing" (main -> production, other branches -> preview URL).
  marketing:
    name: Marketing site (typecheck, build, deploy)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: apps/marketing
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.parliotec.com' }}
          NEXT_PUBLIC_DASHBOARD_URL: ${{ vars.NEXT_PUBLIC_DASHBOARD_URL || 'https://app.parliotec.co.uk' }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://parliotec.co.uk' }}
      - name: Deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/marketing
          command: pages deploy out --project-name parliotec-marketing --branch ${{ github.head_ref || github.ref_name }}
      - if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"

  # Dashboard previews: every PR/branch gets an always-on Cloudflare Pages URL.
  # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Pages:Edit scope).
  deploy-dashboard:
    name: Deploy dashboard (Cloudflare)
    needs: [web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/web
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'https://api.parliotec.com' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Preview alias (lowercase alphanumerics and dashes, max 40 chars)
        id: alias
        run: |
          alias=$(echo "${{ github.head_ref || github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' \
            | cut -c1-40 | sed -E 's/-+$//')  # alias + "parlio-dashboard" must be < 63 chars
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            ${{ github.ref == 'refs/heads/main'
                && 'deploy'
                || format('versions upload --preview-alias {0}', steps.alias.outputs.alias) }}
      - if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, voice-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: parlio-${{ matrix.app }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.73.0
          image-ref: parlio-${{ matrix.app }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # API + voice worker: redeploy the single-VM stack on every push to main.
  # Requires repo secrets VPS_HOST (IP or hostname) and VPS_SSH_KEY (private key for root).
  deploy-vps:
    name: Deploy API/worker (VPS)
    needs: [python, docker, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_VPS: ${{ secrets.VPS_SSH_KEY != '' && secrets.VPS_HOST != '' }}
    steps:
      - name: Deploy over SSH
        if: env.HAS_VPS == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps
          chmod 600 ~/.ssh/vps
          ssh -i ~/.ssh/vps -o StrictHostKeyChecking=accept-new "root@$VPS_HOST" \
            "set -e; cd /opt/parlio && git fetch --quiet origin main && git checkout --quiet ${{ github.sha }} && ./infra/vps/deploy.sh"
      - if: env.HAS_VPS != 'true'
        run: echo "VPS_SSH_KEY/VPS_HOST not set - skipping VPS deploy"
