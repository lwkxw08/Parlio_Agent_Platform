name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: parlio
          POSTGRES_PASSWORD: parlio
          POSTGRES_DB: parlio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parlio" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PARLIO_TEST_DATABASE_URL: postgresql+asyncpg://parlio:parlio@localhost:5432/parlio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/voice-worker/parlio_voice apps/api/parlio_api tools/latency-harness/latency_harness
      - run: uv run pytest -q
      - name: Offline latency harness (simulated call)
        run: uv run parlio-latency --turns 5

  web:
    name: Web (typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run pages:build

  # Dashboard previews: every PR/branch gets an always-on Cloudflare Pages URL.
  # Requires repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (Pages:Edit scope).
  deploy-dashboard:
    name: Deploy dashboard (Cloudflare)
    needs: [web]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    defaults:
      run:
        working-directory: apps/web
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run pages:build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
      - name: Preview alias (lowercase alphanumerics and dashes, max 63 chars)
        id: alias
        run: |
          alias=$(echo "${{ github.head_ref || github.ref_name }}" \
            | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-63)
          echo "alias=$alias" >> "$GITHUB_OUTPUT"
      - name: Deploy
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: >-
            ${{ github.ref == 'refs/heads/main'
                && 'deploy'
                || format('versions upload --preview-alias {0}', steps.alias.outputs.alias) }}
      - if: env.HAS_CF != 'true'
        run: echo "CLOUDFLARE_API_TOKEN not set - skipping deploy"

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, voice-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
