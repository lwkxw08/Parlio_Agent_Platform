
# Single-VM deployment (dev/staging test number). Provider-agnostic: any Ubuntu box with Docker.
# Render config first: ./deploy.sh (reads .env, writes config/ from *.tmpl), then
#   docker compose --env-file .env up -d --build
name: parlio

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: parlio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: parlio
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./config/postgres-init.sql:/docker-entrypoint-initdb.d/10-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parlio"]
      interval: 5s

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data
    # Loopback only: egress runs on the host network and uploads recordings here.
    ports: ["127.0.0.1:9000:9000"]
    environment:
      MINIO_ROOT_USER: parlio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes: ["minio:/data"]

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 parlio ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/parlio-recordings || true"

  # LiveKit + SIP use the host network so SDP/ICE advertise the real public IP.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes: ["./config/livekit.yaml:/etc/livekit.yaml:ro"]
    depends_on:
      redis: { condition: service_healthy }

  livekit-sip:
    image: livekit/sip:latest
    restart: unless-stopped
    command: --config /etc/sip.yaml
    network_mode: host
    volumes: ["./config/sip.yaml:/etc/sip.yaml:ro"]
    depends_on: [livekit]

  # Call recording (per-track egress -> MinIO). Track egress is light; no Chromium is launched.
  livekit-egress:
    image: livekit/egress:latest
    restart: unless-stopped
    network_mode: host
    cap_add: [SYS_ADMIN]
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes: ["./config/egress.yaml:/etc/egress.yaml:ro"]
    depends_on: [livekit, minio]

  api:
    image: ghcr.io/lwkxw08/parlio-api:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PARLIO_REDIS_URL: redis://redis:6379/0
      # LiveKit server API (host network): live listen/whisper, browser voice and the outbound dialer.
      PARLIO_LIVEKIT_URL: http://host.docker.internal:7880
      # Browser-facing signalling URL (Caddy → LiveKit) for dashboard listen/whisper and web voice.
      PARLIO_LIVEKIT_PUBLIC_URL: wss://lk.${PUBLIC_HOST}
      PARLIO_LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      PARLIO_LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      # Outbound AI calls: livekit dials through the platform Telnyx trunk; simulated just logs.
      PARLIO_OUTBOUND_DIALER: ${OUTBOUND_DIALER:-simulated}
      PARLIO_OUTBOUND_TRUNK_ID: ${OUTBOUND_SIP_TRUNK_ID:-}
      PARLIO_OUTBOUND_CALLER_ID: ${OUTBOUND_CALLER_ID:-}
      PARLIO_STORE_BACKEND: postgres
      # Set DATABASE_URL in .env to use a managed Postgres instead of the local container.
      PARLIO_DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://parlio_app:${POSTGRES_APP_PASSWORD}@postgres:5432/parlio}
      PARLIO_DASHBOARD_URL: ${DASHBOARD_URL}
      PARLIO_SITE_URL: ${SITE_URL:-https://parliotec.com}
      # Browser origins allowed to call the API: dashboard + marketing site (www + .co.uk alias).
      PARLIO_CORS_ORIGINS: '["${DASHBOARD_URL}", "${SITE_URL:-https://parliotec.com}", "${SITE_WWW_URL:-https://www.parliotec.com}", "https://parliotec.co.uk", "https://www.parliotec.co.uk"]'
      PARLIO_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PARLIO_CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      PARLIO_ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      PARLIO_TELNYX_API_KEY: ${TELNYX_API_KEY:-}
      PARLIO_TELNYX_CONNECTION_ID: ${TELNYX_CONNECTION_ID:-}
      PARLIO_NUMBER_PROVIDER: ${NUMBER_PROVIDER:-simulated}
      PARLIO_INBOUND_TRUNK_ID: ${INBOUND_SIP_TRUNK_ID:-}
      PARLIO_RECORDING_S3_ENDPOINT: http://minio:9000
      PARLIO_RECORDING_BUCKET: parlio-recordings
      PARLIO_RECORDING_S3_ACCESS_KEY: parlio
      PARLIO_RECORDING_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      redis: { condition: service_healthy }
      minio: { condition: service_started }
      postgres: { condition: service_healthy }

  voice-worker:
    image: ghcr.io/lwkxw08/parlio-voice-worker:${IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: apps/voice-worker/Dockerfile
    restart: unless-stopped
    # Give in-flight calls time to finish when a deploy replaces this container (see deploy.sh).
    stop_grace_period: 30m
    env_file:
      - path: .env
        required: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      LIVEKIT_URL: ws://host.docker.internal:7880
      PARLIO_API_URL: http://api:8000
      PARLIO_REDIS_URL: redis://redis:6379/0
      # Passed through to egress (host network), so it must be reachable from the host.
      PARLIO_RECORDING_S3_ENDPOINT: http://127.0.0.1:9000
      PARLIO_RECORDING_BUCKET: parlio-recordings
      PARLIO_RECORDING_S3_ACCESS_KEY: parlio
      PARLIO_RECORDING_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # LiveKit outbound trunk (see lk_setup.py) used to dial humans for warm transfers.
      PARLIO_OUTBOUND_SIP_TRUNK_ID: ${OUTBOUND_SIP_TRUNK_ID:-}
    depends_on: [livekit, api]

volumes:
  pgdata:
  minio:
  caddy_data:
  caddy_config:
