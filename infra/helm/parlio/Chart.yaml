apiVersion: v2
name: parlio
description: Parlio voice platform - voice workers, Core API and LiveKit SIP bridge
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  - name: livekit-server
    version: "1.x"
    repository: https://helm.livekit.io
    condition: livekit.enabled
  - name: redis
    version: "20.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
